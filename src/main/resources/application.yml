spring:
  application:
    name: CodeLess-backend
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  #mysql
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/CodeLess
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  profiles:
        active: local

server:
  port: 8123
  servlet:
    context-path: /api

# 应用封面自动截图
app:
  avatar:
    storage-dir: ${APP_AVATAR_STORAGE_DIR:./data/avatars}
    public-base-url: ${APP_AVATAR_PUBLIC_BASE_URL:http://localhost:8123/api/user/avatar}
  # 部署作品与生成预览使用独立域名，生产环境分别设置环境变量
  deploy:
    base-url: ${APP_DEPLOY_BASE_URL:http://localhost:9090}
  preview:
    base-url: ${APP_PREVIEW_BASE_URL:http://localhost:8123/api/static}
  cover:
    enabled: true
    # 如未配置会自动查找本机 Chrome 或 Edge，也可通过 BROWSER_PATH 环境变量指定
    browser-path: ${BROWSER_PATH:}
    width: 1200
    height: 675
    timeout-seconds: 20
    render-wait-millis: 3000

#springdoc-openapi
springdoc:
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.hjq.CodeLess.controller
# knife4j
knife4j:
  enable: true
  setting:
    language: zh_cn
